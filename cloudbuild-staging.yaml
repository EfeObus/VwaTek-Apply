# VwaTek Apply - Staging Environment Cloud Build Pipeline
# Triggers: Push to develop/staging branch or manual trigger
# Deploys to separate staging Cloud Run service with staging database

substitutions:
  _REGION: northamerica-northeast1
  _BACKEND_SERVICE: vwatek-backend-staging
  _FRONTEND_BUCKET: vwatek-apply-web-staging
  _CLOUD_SQL_INSTANCE: vwatek-apply:northamerica-northeast1:vwatekapply
  _ENVIRONMENT: staging

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'

steps:
  # ============================================
  # Stage 1: Build Backend
  # ============================================
  - id: 'build-backend'
    name: 'gradle:8.5-jdk17'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        chmod +x gradlew
        ./gradlew :backend:build -x test --no-daemon
        echo "✅ Staging backend build complete"

  # ============================================
  # Stage 2: Run Tests (required to pass)
  # ============================================
  - id: 'test-backend'
    name: 'gradle:8.5-jdk17'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ./gradlew :backend:test --no-daemon
    waitFor: ['build-backend']

  # ============================================
  # Stage 3: Build Docker Image (staging tag)
  # ============================================
  - id: 'docker-build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'
    waitFor: ['build-backend']

  # ============================================
  # Stage 4: Push to Container Registry
  # ============================================
  - id: 'docker-push'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:$COMMIT_SHA']
    waitFor: ['docker-build', 'test-backend']

  # ============================================
  # Stage 5: Deploy to Staging Cloud Run
  # ============================================
  - id: 'deploy-staging'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy ${_BACKEND_SERVICE} \
          --image=gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --no-allow-unauthenticated \
          --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE} \
          --set-env-vars="CLOUD_SQL_DATABASE=Vwatek_Apply_Staging,ENVIRONMENT=${_ENVIRONMENT}" \
          --set-secrets="CLOUD_SQL_USER=db-username:latest,CLOUD_SQL_PASSWORD=db-password:latest,GEMINI_API_KEY=gemini-api-key:latest" \
          --min-instances=0 \
          --max-instances=3 \
          --memory=512Mi \
          --cpu=1 \
          --port=8080 \
          --timeout=300s
        echo "✅ Staging backend deployed"
    waitFor: ['docker-push']

  # ============================================
  # Stage 6: Health Check
  # ============================================
  - id: 'health-check'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        STAGING_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region=${_REGION} --format='value(status.url)')
        echo "Staging URL: $$STAGING_URL"
        sleep 15
        TOKEN=$$(gcloud auth print-identity-token)
        response=$$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $$TOKEN" "$$STAGING_URL/health")
        if [ "$$response" = "200" ]; then
          echo "✅ Staging health check passed"
        else
          echo "❌ Staging health check failed (HTTP $$response)"
          exit 1
        fi
    waitFor: ['deploy-staging']

images:
  - 'gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:$COMMIT_SHA'

timeout: '1200s'
